packages:
  - "apps/*"
  - "libs/*"
  - "tools/*"

# THE GATES READ THIS LIST (D-071). `@arthome/tooling`'s checks used to glob a
#   hand-kept set of layouts, and each one guessed differently — none knew
#   `libs/*`, and `check-enums` knew neither of the two used here. It would have
#   swept an empty set and exited 0, in the repository where duplicated domain
#   literals are most likely: seven services reaching for the same words.
#   Declaring the layout once, to the file pnpm itself obeys, is what keeps the
#   gates and the resolver from disagreeing.

# --------------------------------------------------------------- supply chain
# 10080 minutes = one week during which pnpm refuses a freshly published version.
# Same posture and same reason as arthome-core: for a single maintainer who does
# not watch advisories continuously, a week of settling catches most compromises.
minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  # Without this, a just-packed @arthome/* would be invisible for a week to the
  # repository waiting for it — and the symptom is "that version does not exist".
  - "@arthome/*"

# -------------------------------------------------------------------- catalog
# THERE IS NO CATALOG HERE, AND IT WAS TRIED FIRST.
#
#   The three @arthome/* packages are unpublished and installed from tarballs
#   under vendor/, so every service that imports the domain repeats a path like
#   `file:../../vendor/arthome-core.tgz` — a parallel literal table under a
#   common name, fault E2 applied to paths. A catalog is exactly the instrument
#   for that, so the specs were written as `catalog:` and pnpm refused:
#
#     ERR_PNPM_CATALOG_ENTRY_INVALID_SPEC — the entry for '@arthome/tooling' in
#     catalog 'default' declares a dependency using the 'file' protocol. This is
#     not yet supported, but may be in a future version of pnpm.
#
#   So the repetition stands, and it is GATED instead of trusted:
#   `tools/check-vendor-specs.mjs` fails when a manifest's path disagrees with
#   the tarball it should point at. That is the same answer versions.json gives
#   to the same shape of problem — seven manifests repeating a value, with a
#   check keeping them identical, because the repetition cannot be removed.
#
#   Revisit when pnpm supports `file:` in catalogs; the gate becomes redundant.

# ------------------------------------------------------------------------ builds
# pnpm 11 no longer runs a dependency's install script without a NAMED approval,
# which is the right posture: an install script is arbitrary code run with the
# developer's privileges.
allowBuilds:
  # unrs-resolver — the native (Rust) resolver behind eslint-import-resolver-typescript,
  # which is what makes `import-x/no-cycle` actually resolve TypeScript paths.
  # Its install script links the platform's native binary.
  # Approved because WITHOUT IT the rule does not report that it failed: it runs,
  # finds nothing, and passes — a green gate that checks nothing, which is the
  # worse of the two failure modes and the reason D-071 exists.
  unrs-resolver: true

  # @bufbuild/buf — the Protobuf compiler. Its install script links the
  # platform's native binary, exactly like unrs-resolver. Approved because the
  # wire types are GENERATED from arthome-core's proto/: without the binary
  # there is no generation step at all, and the alternative is hand-written
  # message classes, which is the parallel table this project spends its gates
  # preventing — applied to the contract between seven services.
  "@bufbuild/buf": true

  # ssh2 — DENIED, and denying is the decision rather than the absence of one.
  # It arrives under testcontainers, through docker-modem, and its install script
  # compiles an OPTIONAL native crypto binding used only when Docker is reached
  # over SSH. The harness talks to the local socket, so the binding buys nothing
  # and ssh2 falls back to its pure-JavaScript implementation without it.
  # An install script is arbitrary code run with the developer's privileges; one
  # that serves no path we use is the easiest kind to say no to.
  ssh2: false

  # cpu-features — DENIED. ssh2's optional companion, compiled to detect CPU
  # crypto extensions for the native binding we just declined. Nothing uses it.
  cpu-features: false

  # protobufjs — DENIED. Its postinstall exists for the package's own CLI, which
  # nothing here invokes: the Protobuf types are generated by buf at
  # `pnpm run gen:events`, and the runtime is @bufbuild/protobuf. It arrives as a
  # transitive dependency, and a transitive install script is precisely the one
  # worth refusing by default.
  protobufjs: false

# `libs/messaging` and `libs/testing` import each other, so pnpm refuses to order
#   their builds. The cycle is test-only — messaging reaches testing from
#   `consume.itest.ts` alone, which `tsconfig.build.json` excludes — and the order is
#   genuinely arbitrary: both tsconfigs resolve a workspace dependency through
#   `customConditions: ['@arthome/source']`, so each reads the other's SOURCE and
#   needs no `dist`. Proven by hiding both dists and building `testing` first.
ignoreWorkspaceCycles: true
