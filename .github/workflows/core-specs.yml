name: core-specs

on:
  pull_request:
    branches: [develop, main]

jobs:
  core-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node tools/check-core-specs.mjs --require-release
