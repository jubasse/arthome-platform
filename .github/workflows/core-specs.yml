name: core-specs

on:
  pull_request:
    branches: [develop, main]

jobs:
  core-specs:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: node tools/check-core-specs.mjs --require-release
