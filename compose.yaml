# The infrastructure the event path needs, and nothing else yet.
#
# THIS FILE IS NOT A MINIATURE OF PRODUCTION and does not pretend to be.
#   One broker, one connector, no replication, no TLS, no schema registry yet.
#   What it does reproduce faithfully is the part the code depends on: logical
#   decoding, one replication slot per service, and the Debezium outbox router's
#   column contract (data-model.md §7.3).

name: arthome

services:
  postgres:
    image: postgres:18-alpine
    # wal_level=logical IS THE WHOLE POINT, and it needs a restart on a real
    #   server (data-model.md §7.4). Debezium reads the WAL; on the default
    #   `replica` level there is nothing to read and the connector fails at
    #   startup with a message that does not say this.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=8
      - -c
      - max_wal_senders=8
    environment:
      POSTGRES_USER: arthome
      POSTGRES_PASSWORD: arthome
      POSTGRES_DB: identity
    volumes:
      # Runs only on an empty data directory. `docker compose down -v` is what
      # makes it run again.
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    ports:
      # 55432, NOT 5432. The conventional port was already held by another
      #   project on this machine, and taking it would have stopped that one.
      #   A development stack that fights for well-known ports is a stack you
      #   cannot run beside anything else.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthome -d identity"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 30

  connect:
    image: quay.io/debezium/connect:3.0.0.Final
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: arthome-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      # SINGLE NODE AND NO SECURITY PLUGIN: this is a development stack, and
      #   saying so in the configuration is better than a README nobody reads.
      #   A cluster, TLS and real credentials are a deployment concern.
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # OpenSearch refuses to start with the default heap on a small host.
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "false"
    ports:
      - "19200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
